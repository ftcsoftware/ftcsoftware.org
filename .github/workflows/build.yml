name: Build

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout your repository using git
              uses: actions/checkout@v7

            # No version pin: action-setup reads `packageManager` from
            # package.json, so pnpm stays in sync with the lockfile.
            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # CI check only. Cloudflare Workers Builds handles production
            # deploys and PR preview URLs.
            - name: Build site
              run: pnpm build
